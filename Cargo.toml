[package]
name = "logscope"
version = "0.4.4"
edition = "2021"
description = "Rust port of the LogScope log-parsing core (Phase 1: models + parser)"

[dependencies]
bzip2 = "0.6.1"
chrono = "0.4"
clap = { version = "4.6.7", features = ["derive"] }
eframe = "0.36.2"
egui = "0.36.2"
evtx = "0.12"
flate2 = "1.1.10"
image = "0.25.10"
regex = "1"
rfd = "0.17.2"
tar = "0.4.46"
thiserror = "2.0.20"
zip = "8.6.0"

[[bin]]
name = "logscope-cli"
path = "src/bin/logscope_cli.rs"

[[bin]]
name = "logscope-gui"
path = "src/bin/logscope_gui.rs"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[build-dependencies]
embed-resource = "3.0.11"
